# Static frontend only. The existing Cloudflare backend remains in use.
[build]
  command = "node scripts/build-netlify.mjs"
  publish = "netlify-static"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# API calls connect directly to Cloudflare.
[[redirects]]
  from = "/cms"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
